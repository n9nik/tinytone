name: Android Cloud Build

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Base App Template.zip"
      - "TinyTone.zip"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/gradle.properties"
      - "**/settings.gradle*"
      - "**/app/**"
      - ".github/workflows/android-cloud-build.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"

jobs:
  build-debug-apk:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract the app template when source is zipped
        shell: bash
        run: |
          set -euo pipefail
          nested_settings="$(
            find "$GITHUB_WORKSPACE" -mindepth 2 -maxdepth 4 -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit
          )"
          if [[ -f settings.gradle || -f settings.gradle.kts || -n "$nested_settings" ]]; then
            echo "Android source is already present; no extraction needed."
          elif [[ -f "Base App Template.zip" ]]; then
            unzip -o "Base App Template.zip" -d "$GITHUB_WORKSPACE"
          elif [[ -f "TinyTone.zip" ]]; then
            unzip -o "TinyTone.zip" -d "$GITHUB_WORKSPACE"
          else
            echo "No Android project or zip was found - assuming source is present."
          fi
          ls -R | head -n 100

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE"
          else
            mapfile -t settings_files < <(
              find "$GITHUB_WORKSPACE" -mindepth 2 -maxdepth 4 -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -print
            )
            if [[ ${#settings_files[@]} -ne 1 ]]; then
              echo "Expected exactly one Android project, found ${#settings_files[@]}."
              printf '%s\n' "${settings_files[@]:-}"
              exit 1
            fi
            project_dir="$(dirname "${settings_files[0]}")"
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Building project in $project_dir"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Create Gradle wrapper when missing
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew ]]; then
            gradle wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin
          fi
          chmod +x gradlew

      - name: Decode upload keystore from secrets
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]]; then
            echo "No UPLOAD_KEYSTORE_BASE64 secret set, skipping keystore decode (debug build only)"
            exit 0
          fi
          mkdir -p app
          printf '%s' "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          echo "Keystore decoded:"
          ls -lh app/upload-keystore.jks
          # Verify keystore integrity without exposing passwords in logs
          keytool -list -keystore app/upload-keystore.jks -storepass "${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}" 2>&1 | head -n 20
          keytool -list -keystore app/upload-keystore.jks -storepass "${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}" -alias "${{ secrets.UPLOAD_KEY_ALIAS }}" || {
            echo "ERROR: keytool could not find alias ${{ secrets.UPLOAD_KEY_ALIAS }} in keystore"
            exit 1
          }
          echo "Keystore verification passed."

      - name: Run tests and build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Build release AAB for Play Console
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          UPLOAD_KEYSTORE_PATH: app/upload-keystore.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          CI: "true"
        run: |
          set -euo pipefail
          if [[ -f "app/upload-keystore.jks" ]]; then
            echo "Building SIGNED release AAB (secrets present)"
            ./gradlew --no-daemon --stacktrace bundleRelease \
              -PADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713 \
              -PADMOB_BANNER_ID=ca-app-pub-3940256099942544/6300978111
          else
            echo "No keystore found - build should fail in CI due to missing secrets"
            echo "To build signed AAB, add GitHub Secrets:"
            echo "  UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD"
            ./gradlew --no-daemon --stacktrace bundleRelease \
              -PADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713 \
              -PADMOB_BANNER_ID=ca-app-pub-3940256099942544/6300978111
          fi

      - name: Create APK checksums
        if: success()
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(
            find . -path "*/build/outputs/apk/debug/*.apk" -type f -print0
          )
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "The build completed but produced no debug APK."
            exit 1
          fi
          printf '%s\0' "${apks[@]}" | sort -z | xargs -0 sha256sum \
            > android-debug-apk.sha256
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/bundle/release/ || echo "no bundle dir yet"

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
            ${{ steps.project.outputs.dir }}/android-debug-apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
